<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sổ lưu bút{% endblock %}</title>
</head>
<body>
    <header>
        <h2><a href="{% url 'index' %}">Sổ lưu bút</a></h2>
        <nav>
            <a href="{% url 'index' %}">Trang chủ</a> |
            <a href="{% url 'add' %}">Viết lời nhắn</a> |
            <a href="{% url 'stats' %}">Thống kê</a>
        </nav>
        <hr>
    </header>

    <main>
        {% for msg in messages %}
        <p><strong>Thông báo:</strong> {{ msg }}</p>
        <hr>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>

    <hr>
    <footer>
        <p>Sổ lưu bút</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
